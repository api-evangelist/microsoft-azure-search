name: Azure AI Search
description: >-
  Azure AI Search (formerly Azure Cognitive Search) is a cloud search service with built-in AI capabilities for
  enriching content and enabling vector and semantic search over heterogeneous data. It indexes content from Azure data
  sources and supports full-text, faceted, geospatial, vector, and hybrid retrieval.
